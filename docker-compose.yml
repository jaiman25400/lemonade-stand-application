services:
  postgres:
    image: postgres:16-alpine
    container_name: lemonade-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lemonade
      POSTGRES_PASSWORD: lemonade
      POSTGRES_DB: lemonade_stand
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemonade -d lemonade_stand"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
